name: Publish Python Package

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  validate-release:
    name: Validate Release Metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: 校验 release 来源分支
        run: |
          TARGET_BRANCH="${{ github.event.release.target_commitish }}"
          echo "release.target_commitish=${TARGET_BRANCH}"
          if [[ "${TARGET_BRANCH}" != "package" ]]; then
            echo "::error title=非法发布来源::仅允许从 package 分支创建 Release。当前来源: ${TARGET_BRANCH}"
            exit 1
          fi

      - name: 校验 tag 与 pyproject 版本一致
        id: version
        run: |
          TAG_NAME="${{ github.event.release.tag_name }}"
          TAG_VERSION="${TAG_NAME#v}"
          PROJECT_VERSION="$(grep -E '^version[[:space:]]*=' pyproject.toml | head -n1 | sed -E 's/^version[[:space:]]*=[[:space:]]*\"([^\"]+)\"/\1/')"
          if [[ -z "${PROJECT_VERSION}" ]]; then
            echo "::error title=缺少版本字段::pyproject.toml 中未找到可解析的 version 字段"
            exit 1
          fi

          echo "tag_name=${TAG_NAME}"
          echo "tag_version=${TAG_VERSION}"
          echo "project_version=${PROJECT_VERSION}"

          if [[ "${PROJECT_VERSION}" != "${TAG_VERSION}" ]]; then
            echo "::error title=版本不一致::pyproject.toml=${PROJECT_VERSION}, tag=${TAG_NAME}"
            exit 1
          fi

          echo "version=${PROJECT_VERSION}" >> "$GITHUB_OUTPUT"

  release-build:
    name: Build Distributions
    runs-on: ubuntu-latest
    needs:
      - validate-release
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build release distributions
        run: |
          python -m pip install --upgrade pip
          python -m pip install build
          python -m build

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: release-dists
          path: dist/

  pypi-publish:
    name: Publish to PyPI (Trusted Publishing)
    runs-on: ubuntu-latest
    needs:
      - validate-release
      - release-build
    permissions:
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/project/league-tools/${{ needs.validate-release.outputs.version }}/
    steps:
      - name: Retrieve release distributions
        uses: actions/download-artifact@v4
        with:
          name: release-dists
          path: dist/

      - name: Publish release distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
