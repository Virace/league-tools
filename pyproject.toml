[project]
name = "league-tools"
version = "1.1.5"
description = "WAD、BIN、BNK、WPK文件简单处理"
authors = [{ name = "Virace", email = "Virace@aliyun.com" }]
keywords = ["league", "wad", "bnk"]
dependencies = [
    "xxhash>=3.7.0",
    "loguru>=0.7.3",
    "zstd>=1.5.7.3",
    "lxml>=6.1.1",
    "quick-xmltodict>=0.1.3",
    "urllib3>=2.7.0",
]
readme = "README.md"
license = {file = "LICENSE"}
classifiers = [
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: OS Independent",
]
requires-python = ">= 3.10"

[project.urls]
homepage = "https://github.com/Virace/py-bnk-extract"
repository = "https://github.com/Virace/py-bnk-extract"
"Bug Tracker" = "https://github.com/Virace/py-bnk-extract/issues"


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true

[dependency-groups]
dev = [
    "psutil>=7.2.2",
    "pytest>=9.0.3",
]

[tool.uv]
managed = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.sdist]
exclude = [
    "*.json",
    ".ai_memory/**",
    ".github/**",
    "data/**",
    "dist/**",
    "docs/**",
    "manual_tests/**",
    "raw/**",
    "scripts/**",
    "tests/**",
]

[tool.hatch.build.targets.wheel]
packages = ["src/league_tools"]
exclude = [
    "*.json",
]
